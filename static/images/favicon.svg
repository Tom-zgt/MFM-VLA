<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e4bb8"/>
      <stop offset="1" stop-color="#0d8a82"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Two converging camera rays meeting at a 3D target point -->
  <line x1="14" y1="48" x2="32" y2="20" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.92"/>
  <line x1="50" y1="48" x2="32" y2="20" stroke="#99f6e4" stroke-width="4" stroke-linecap="round" opacity="0.92"/>
  <circle cx="32" cy="20" r="6" fill="#ffffff"/>
</svg>
